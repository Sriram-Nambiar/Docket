version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docket-postgres
    restart: always
    environment:
      POSTGRES_USER: docket_user
      POSTGRES_PASSWORD: docket_password
      POSTGRES_DB: docket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
